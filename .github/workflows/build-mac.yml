name: Build Mac app
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Mac processor
        type: choice
        options:
          - arm64
          - intel
        default: arm64
permissions:
  contents: read
concurrency:
  group: mac-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ${{ inputs.architecture == 'intel' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 合照工坊-Mac云端打包
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-mac.txt
          python -m pip install 'pyinstaller==6.22.3'
          python -c 'import tkinter, onnxruntime; print(onnxruntime.get_available_providers())'
      - name: Download and verify models
        run: python setup_model.py
      - name: Build standalone app
        run: python build_mac.py
      - name: Test frozen application
        run: python verify_mac.py
      - name: Archive app preserving permissions
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/PhotoStudio.app PhotoStudio-Mac-${{ inputs.architecture }}.zip
          shasum -a 256 PhotoStudio-Mac-${{ inputs.architecture }}.zip > PhotoStudio-Mac-${{ inputs.architecture }}.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoStudio-Mac-${{ inputs.architecture }}
          path: |
            合照工坊-Mac云端打包/PhotoStudio-Mac-*.zip
            合照工坊-Mac云端打包/PhotoStudio-Mac-*.sha256.txt
            合照工坊-Mac云端打包/使用说明.txt
            合照工坊-Mac云端打包/verification/*.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
